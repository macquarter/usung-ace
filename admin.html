<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="favicon.png?v=2">
<link rel="shortcut icon" href="favicon.ico?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YUSUNG ACE · 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --sf:#111114; --cd:#17171c; --bd:#26262e;
  --ac:#3b82f6; --ac2:#60a5fa; --gn:#22c55e; --rd:#ef4444; --am:#f59e0b;
  --tx:#f5f5f7; --tx2:#c7c7cc; --tx3:#8e8e93; --tx4:#636366; --tx5:#48484a;
  --sd:0 10px 30px -10px rgba(0,0,0,.6);
}
body.light{
  --bg:#f5f5f7; --sf:#ffffff; --cd:#fafafa; --bd:#e5e5ea;
  --tx:#0a0a0a; --tx2:#1c1c1e; --tx3:#3a3a3c; --tx4:#8e8e93; --tx5:#c7c7cc;
  --sd:0 10px 30px -10px rgba(0,0,0,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{height:100%}
body{font-family:'Pretendard','Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit;background:transparent;border:none;outline:none;width:100%}
a{color:inherit;text-decoration:none}

/* ============ LOGIN ============ */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 20%,rgba(59,130,246,.18),transparent 50%),radial-gradient(circle at 80% 80%,rgba(96,165,250,.12),transparent 50%),var(--bg)}
.login-card{width:100%;max-width:420px;background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:44px 36px;box-shadow:var(--sd)}
.login-brand{text-align:center;margin-bottom:32px}
/* r58) 로고는 원래도 있었지만 「안 보였다」 — 유성 에이스 로고.png 는 남색 도형 + 남색
 *   「신개념신기술」이 투명 배경에 얹힌 그림이고, 이 카드는 #111114(거의 검정)다.
 *   → 밑줄 문구가 배경에 묻혀 사라진다. 흰 판을 깔아 원본 그대로 보이게 한다.
 *   ★ 라이트 테마에서도 같은 판을 쓴다(흰 위의 흰 판 = 무해). 테마 분기하지 않는다. */
.login-plate{display:inline-block;background:#fff;border-radius:18px;padding:16px 26px 12px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);margin-bottom:16px}
.login-logo img{display:block;height:76px;width:auto}
.login-title{font-size:19px;font-weight:800;letter-spacing:-.4px;color:var(--tx)}
.login-sub{margin-top:6px;color:var(--tx3);font-size:13px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;color:var(--tx3);margin-bottom:6px;font-weight:600}
.login-field input{padding:14px 16px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;font-size:14px;transition:border .15s}
.login-field input:focus{border-color:var(--ac)}
.login-btn{width:100%;padding:14px;background:var(--ac);color:#fff;border-radius:12px;font-weight:700;font-size:14px;margin-top:8px;transition:transform .1s}
.login-btn:hover{background:var(--ac2)}
.login-btn:active{transform:scale(.98)}
.login-hint{text-align:center;margin-top:18px;font-size:12px;color:var(--tx4)}

/* ============ LAYOUT ============ */
.app{display:none;min-height:100vh}
.app.active{display:flex}
.sb{width:220px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:10}
.sb-brand{padding:20px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.sb-brand .dot{width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 14px var(--ac)}
.sb-brand .nm{font-weight:800;font-size:15px;letter-spacing:-0.3px}
.sb-brand .tg{font-size:10px;color:var(--tx4);letter-spacing:.1em;text-transform:uppercase}
.sb-nav{flex:1;padding:14px 10px;overflow-y:auto}
.sb-sec{font-size:10px;color:var(--tx4);text-transform:uppercase;letter-spacing:.1em;padding:14px 10px 8px;font-weight:700}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--tx2);font-size:13px;font-weight:500;transition:all .12s;margin-bottom:2px;cursor:pointer;width:100%;text-align:left}
.sb-item:hover{background:var(--cd);color:var(--tx)}
.sb-item.active{background:var(--ac);color:#fff}
.sb-item .ic{font-size:15px;width:18px;text-align:center}
.sb-item .bd-num{margin-left:auto;font-size:10px;padding:2px 6px;border-radius:8px;background:var(--cd);color:var(--tx3)}
.sb-item.active .bd-num{background:rgba(255,255,255,.25);color:#fff}
.sb-user{padding:14px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.sb-user .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
.sb-user .nm{font-size:12px;font-weight:600}
.sb-user .em{font-size:10px;color:var(--tx4)}
.sb-user .lo{margin-left:auto;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;font-size:11px;color:var(--tx3)}
.sb-user .lo:hover{background:var(--cd);color:var(--tx)}

.main{flex:1;margin-left:220px;min-height:100vh;display:flex;flex-direction:column}
.tb{height:54px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:5}
.tb-ti{font-weight:700;font-size:15px}
.tb-sp{flex:1}
.tb-btn{padding:7px 12px;border:1px solid var(--bd);border-radius:9px;font-size:12px;font-weight:600;color:var(--tx2);display:flex;align-items:center;gap:6px}
.tb-btn:hover{background:var(--cd);color:var(--tx)}
.tb-btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.tb-btn.pri:hover{background:var(--ac2)}
.tb-mo{padding:7px 10px;background:var(--cd);border:1px solid var(--bd);border-radius:9px;font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.tb-mo .dot{width:6px;height:6px;border-radius:50%;background:var(--gn)}

.ct{flex:1;padding:22px}

/* ============ VIEW ============ */
.vw{display:none}
.vw.active{display:block}
.vw-hd{display:flex;align-items:center;margin-bottom:20px;gap:14px}
.vw-ti{font-size:22px;font-weight:800;letter-spacing:-0.4px}
.vw-sub{color:var(--tx3);font-size:13px;margin-top:3px}

/* ============ CARDS ============ */
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
.cd-ti{font-size:13px;font-weight:700;color:var(--tx2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.cd-ti .ln{flex:1;height:1px;background:var(--bd)}

/* ============ DASHBOARD ============ */
.st-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.st-cd{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden}
.st-cd::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--ac) 0%,transparent 40%);opacity:.08}
.st-cd .lb{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;position:relative}
.st-cd .vl{font-size:28px;font-weight:800;margin-top:6px;letter-spacing:-0.8px;position:relative}
.st-cd .dl{font-size:11px;color:var(--gn);margin-top:4px;position:relative;font-weight:600}
.st-cd .dl.dn{color:var(--rd)}

.db-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.bar-wrap{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.bar{flex:1;background:linear-gradient(180deg,var(--ac),var(--ac2));border-radius:6px 6px 0 0;position:relative;min-height:6px;transition:all .3s}
.bar:hover{transform:translateY(-3px)}
.bar-lb{text-align:center;font-size:10px;color:var(--tx4);margin-top:6px;font-weight:600}
.bar-vl{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--tx2)}

.rc-lst{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.rc-it{padding:10px 12px;background:var(--cd);border-radius:10px;display:flex;align-items:center;gap:10px}
.rc-it .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.rc-it .info{flex:1;min-width:0}
.rc-it .nm{font-size:12px;font-weight:600}
.rc-it .ms{font-size:11px;color:var(--tx4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-it .tg{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600}
.tg-new{background:rgba(34,197,94,.15);color:var(--gn)}
.tg-pd{background:rgba(245,158,11,.15);color:var(--am)}
.tg-rp{background:rgba(139,139,139,.15);color:var(--tx3)}

/* ============ PAGES / EDIT ============ */
.pg-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pg-tile{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;cursor:pointer;transition:all .15s;position:relative}
.pg-tile:hover{border-color:var(--ac);transform:translateY(-2px)}
.pg-tile .ic{width:38px;height:38px;border-radius:10px;background:var(--cd);display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px}
.pg-tile .nm{font-weight:700;font-size:14px}
.pg-tile .mt{font-size:11px;color:var(--tx4);margin-top:4px}
.pg-tile .hd{position:absolute;top:14px;right:14px;font-size:9px;padding:2px 7px;border-radius:6px;background:rgba(239,68,68,.15);color:var(--rd);font-weight:700}

.mode-sw{display:inline-flex;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px}
.mode-sw button{padding:6px 12px;border-radius:7px;font-size:11px;color:var(--tx3);font-weight:600}
.mode-sw button.active{background:var(--ac);color:#fff}

.ed-sec{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px}
.ed-sec-hd{display:flex;align-items:center;margin-bottom:12px}
.ed-sec-ti{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2)}
.ed-sec-sp{flex:1}
.ed-fl{display:flex;flex-direction:column;gap:10px}
.ed-ln{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--bd)}
.ed-ln:last-child{border-bottom:none}
.ed-lb{font-size:11px;color:var(--tx3);font-weight:600;padding-top:9px;text-transform:uppercase;letter-spacing:.05em}
.ed-in{padding:9px 12px;background:var(--cd);border:1px solid var(--bd);border-radius:9px;font-size:13px;min-height:36px;word-break:break-word;white-space:pre-wrap}
.ed-in:focus{border-color:var(--ac);outline:none}
.ed-in[contenteditable="true"]{cursor:text}
textarea.ed-in{min-height:72px;resize:vertical;line-height:1.5}
.img-up{background:var(--cd);border:1px dashed var(--bd);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center}
.img-up img{width:68px;height:68px;object-fit:cover;border-radius:7px;background:var(--bd)}
.img-up .bt{padding:7px 12px;border:1px solid var(--bd);border-radius:8px;font-size:11px;background:var(--sf);font-weight:600}
.img-up .bt:hover{background:var(--bd)}

.live-wrap{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:24px;min-height:400px}
.w-h1{font-size:28px;font-weight:800;color:var(--tx);line-height:1.2;margin-bottom:10px;letter-spacing:-0.5px}
.w-h2{font-size:20px;font-weight:700;color:var(--tx);margin:14px 0 8px}
.w-p{color:var(--tx2);font-size:13px;line-height:1.6;margin-bottom:8px}
.w-tag{display:inline-block;padding:4px 10px;background:rgba(255,90,31,.15);color:var(--ac);border-radius:20px;font-size:11px;font-weight:600;margin-bottom:10px}
.w-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.w-card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px}
.w-card .nm{font-weight:700;font-size:13px;margin-bottom:4px}
.w-card .de{font-size:11px;color:var(--tx4)}
.w-img{width:100%;height:140px;object-fit:cover;border-radius:10px;background:var(--bd);margin-bottom:10px}
[contenteditable="true"]{border-radius:6px;padding:2px 5px;margin:-2px -5px;transition:background .12s;outline:none}
[contenteditable="true"]:hover{background:rgba(59,130,246,.1)}
[contenteditable="true"]:focus{background:rgba(59,130,246,.18);box-shadow:inset 0 0 0 1px var(--ac)}

/* =============== LIVE PREVIEW =============== */
.live-stage{background:#000;border-radius:18px;overflow:hidden;border:1px solid #222;color:#fff;font-family:'Pretendard','Inter',sans-serif;padding:40px 28px;min-height:500px;position:relative}
.live-stage *{color:inherit}
.live-stage .lp-tag{font-size:11px;font-weight:700;letter-spacing:.32em;color:#60a5fa;margin-bottom:20px;display:block}
.live-stage .lp-h1{font-size:42px;font-weight:900;letter-spacing:-0.04em;line-height:.95;color:#fff;margin-bottom:18px}
.live-stage .lp-h1 .grad,.live-stage .grad{background:linear-gradient(90deg,#60a5fa,#67e8f9,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.live-stage .lp-sub{font-size:16px;color:rgba(255,255,255,.6);line-height:1.6;max-width:620px}
.live-stage .lp-h2{font-size:28px;font-weight:900;letter-spacing:-0.02em;line-height:1.1;color:#fff;margin:26px 0 10px}
.live-stage .lp-p{color:rgba(255,255,255,.7);font-size:13px;line-height:1.7;margin-bottom:8px}
.live-stage .lp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.live-stage .lp-cell{background:#000;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:18px}
.live-stage .lp-cell .lb{font-size:10px;font-weight:700;letter-spacing:.18em;color:#60a5fa;margin-bottom:8px}
.live-stage .lp-cell .vl{font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.02em}
.live-stage .lp-cell .sm{font-size:11px;color:rgba(255,255,255,.45);margin-top:3px}
.live-stage .lp-feats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}
.live-stage .lp-feat{display:flex;gap:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.live-stage .lp-feat .ic{width:42px;height:42px;flex-shrink:0;border-radius:12px;background:rgba(59,130,246,.15);color:#60a5fa;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.live-stage .lp-feat h4{font-size:15px;font-weight:900;color:#fff;margin-bottom:4px;letter-spacing:-0.01em}
.live-stage .lp-feat p{font-size:12px;color:rgba(255,255,255,.55);line-height:1.55}
.live-stage .lp-pill{display:inline-block;padding:6px 14px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(59,130,246,.15);color:#60a5fa;margin-right:6px;margin-bottom:6px}
.live-stage .lp-card{background:#111;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.live-stage .lp-card .no{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;color:#60a5fa;letter-spacing:.1em}
.live-stage .lp-card .cat{font-size:10px;font-weight:700;letter-spacing:.14em;color:#60a5fa;margin-bottom:6px;text-transform:uppercase}
.live-stage .lp-card .nm{font-size:15px;font-weight:800;color:#fff;margin-bottom:4px;letter-spacing:-0.01em}
.live-stage .lp-card .sp{font-size:11px;color:rgba(255,255,255,.55);line-height:1.5}
.live-stage .lp-pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.live-stage .lp-hero{background:radial-gradient(900px 500px at 50% 30%,#1e293b 0%,#0a0f1c 60%,#000 100%);border-radius:18px;padding:36px;text-align:center;border:1px solid rgba(255,255,255,.08);margin-bottom:22px}
.live-stage .lp-hero .lp-tag{text-align:center}
.live-stage .lp-hero .lp-h1{text-align:center}
.live-stage .lp-hero .lp-sub{text-align:center;margin:0 auto}
.live-stage .lp-step{background:#0f0f12;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;position:relative}
.live-stage .lp-step .num{font-size:11px;font-weight:900;letter-spacing:.22em;color:#60a5fa;margin-bottom:10px}
.live-stage .lp-step .tt{font-size:16px;font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:-0.01em}
.live-stage .lp-step .dd{font-size:12px;color:rgba(255,255,255,.55);line-height:1.6}
.live-stage .lp-timeline{position:relative;padding-left:22px;border-left:1px solid rgba(96,165,250,.3);margin-top:10px}
.live-stage .lp-timeline .it{position:relative;margin-bottom:18px}
.live-stage .lp-timeline .it::before{content:'';position:absolute;left:-27px;top:6px;width:10px;height:10px;border-radius:50%;background:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.2)}
.live-stage .lp-timeline .yr{font-size:13px;font-weight:900;color:#60a5fa;margin-bottom:3px}
.live-stage .lp-timeline .tx{font-size:13px;color:rgba(255,255,255,.85)}
.live-stage .lp-info{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:rgba(255,255,255,.08);border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.live-stage .lp-info .ib{background:#000;padding:20px}
.live-stage .lp-info .ib .lb2{font-size:10px;font-weight:700;letter-spacing:.16em;color:#60a5fa;margin-bottom:8px}
.live-stage .lp-info .ib .vl2{font-size:19px;font-weight:800;color:#fff;letter-spacing:-0.01em}
.live-stage .lp-info .ib .sm2{font-size:11px;color:rgba(255,255,255,.45);margin-top:3px}
.live-stage .lp-info .ib.full{grid-column:1/-1}
.live-stage [contenteditable="true"]{outline:none;border-radius:4px;padding:1px 4px;margin:-1px -4px;transition:background .12s}
.live-stage [contenteditable="true"]:hover{background:rgba(96,165,250,.12)}
.live-stage [contenteditable="true"]:focus{background:rgba(96,165,250,.22);box-shadow:inset 0 0 0 1px #60a5fa}
.live-hint{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx4);margin-bottom:10px;padding:8px 12px;background:rgba(59,130,246,.08);border:1px dashed rgba(59,130,246,.3);border-radius:8px}
.live-hint b{color:var(--ac)}
.live-stage .arr-ctrl{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.live-stage .arr-wrap:hover .arr-ctrl{opacity:1}
.live-stage .arr-wrap{position:relative}
.live-stage .arr-ctrl button{width:24px;height:24px;padding:0;border-radius:7px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700}
.live-stage .arr-ctrl button:hover{background:#60a5fa;border-color:#60a5fa}
.live-stage .arr-ctrl button.del:hover{background:#ef4444;border-color:#ef4444}
.live-stage .arr-add{display:block;width:100%;padding:14px;margin-top:14px;border:2px dashed rgba(96,165,250,.4);background:rgba(59,130,246,.08);color:#60a5fa;border-radius:14px;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s}
.live-stage .arr-add:hover{background:rgba(59,130,246,.18);border-color:#60a5fa}
.live-stage.light-sec .arr-ctrl button{background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.1);color:#000}
.live-stage.light-sec .arr-add{border-color:rgba(37,99,235,.4);background:rgba(37,99,235,.08);color:#2563eb}

/* ============ TABLES ============ */
.tbl{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.tbl thead{background:var(--cd)}
.tbl th{text-align:left;font-size:11px;color:var(--tx3);font-weight:700;padding:12px 14px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--bd)}
.tbl td{padding:13px 14px;font-size:13px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--cd)}
.tbl .ac{display:flex;gap:6px}
.tbl .ac button{padding:5px 10px;border:1px solid var(--bd);border-radius:7px;font-size:11px;font-weight:600;color:var(--tx2)}
.tbl .ac button:hover{background:var(--cd);color:var(--tx)}
.tbl .ac button.dn{color:var(--rd);border-color:rgba(239,68,68,.3)}

.fm-md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.fm-md.active{display:flex}
.fm-bx{background:var(--sf);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--sd)}
.fm-hd{padding:18px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:center}
.fm-hd .ti{font-weight:700;font-size:15px}
.fm-hd .cl{margin-left:auto;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--tx3)}
.fm-hd .cl:hover{background:var(--cd);color:var(--tx)}
.fm-bd{padding:20px 22px}
.fm-ft{padding:14px 22px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end}
.fm-fl{margin-bottom:14px}
.fm-fl label{display:block;font-size:11px;color:var(--tx3);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.fm-fl input,.fm-fl textarea,.fm-fl select{padding:10px 12px;background:var(--cd);border:1px solid var(--bd);border-radius:9px;font-size:13px}
.fm-fl input:focus,.fm-fl textarea:focus,.fm-fl select:focus{border-color:var(--ac)}
.fm-fl textarea{min-height:100px;resize:vertical;line-height:1.5}

/* ============ TOAST ============ */
.ts{position:fixed;bottom:22px;right:22px;background:var(--sf);border:1px solid var(--bd);border-left:3px solid var(--gn);border-radius:11px;padding:12px 18px;font-size:13px;font-weight:600;box-shadow:var(--sd);z-index:200;transform:translateX(calc(100% + 30px));transition:transform .3s}
.ts.active{transform:translateX(0)}
.ts.err{border-left-color:var(--rd)}

.sg{padding:60px 20px;text-align:center;color:var(--tx4);font-size:13px}
.bd-ht{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.bd-ct{padding:7px 14px;background:var(--sf);border:1px solid var(--bd);border-radius:9px;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer}
.bd-ct.active{background:var(--ac);color:#fff;border-color:var(--ac)}

/* r46) 좁은 화면 메뉴 버튼. 아래 900px 미디어쿼리에 .sb.open 슬라이드가 원래부터 있었는데
   open 을 붙이는 코드가 어디에도 없었다(grep 0건). 그래서 메뉴 12개가 화면 밖 x=-210 에 갇혀
   900px 이하에서는 대시보드 말고 어느 화면에도 갈 수 없었다. 빠진 버튼만 채운다. */
.sb-toggle{display:none;font-size:17px;line-height:1;padding:6px 11px}
.sb-bd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.sb-bd.on{display:block}
@media(max-width:900px){
  .sb{transform:translateX(-100%);transition:transform .2s;z-index:30;box-shadow:0 0 40px rgba(0,0,0,.55)}
  .sb.open{transform:translateX(0)}
  .sb-toggle{display:inline-flex;align-items:center}
  .main{margin-left:0}
  .st-grid{grid-template-columns:repeat(2,1fr)}
  .db-grid{grid-template-columns:1fr}
  .pg-list{grid-template-columns:1fr}
}
/* ============ IMAGE MANAGER ============ */
.img-mgr{margin-top:18px}
.img-mgr-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.img-mgr-hd .ti{font-size:16px;font-weight:800;letter-spacing:-.02em}
.img-mgr-hd .cnt{font-size:12px;color:var(--tx3);font-weight:600}
.img-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.img-filter button{padding:5px 14px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--bd);color:var(--tx3);transition:all .12s}
.img-filter button:hover{border-color:var(--ac);color:var(--ac)}
.img-filter button.act{background:var(--ac);color:#fff;border-color:var(--ac)}
.img-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.img-grid.sm{grid-template-columns:repeat(6,1fr);gap:8px}
.img-grid.sm .img-card img{aspect-ratio:1}
.img-grid.sm .img-card .info{padding:4px 6px}
.img-grid.sm .img-card .nm{font-size:9px}
.img-grid.sm .img-card .cat{font-size:8px}
.img-grid.sm .img-add-card{min-height:100px}
.img-card .nm-edit{display:inline-flex;align-items:center;gap:3px;cursor:pointer;max-width:100%}
.img-card .nm-edit:hover .edit-ico{opacity:1}
.img-card .edit-ico{opacity:0;transition:opacity .15s;font-size:9px;flex-shrink:0}
.img-card{position:relative;background:var(--cd);border:1px solid var(--bd);border-radius:12px;overflow:hidden;transition:all .15s}
.img-card:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 8px 24px -8px rgba(59,130,246,.2)}
.img-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#0a0a0a}
.img-card .info{padding:8px 10px}
.img-card .nm{font-size:11px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img-card .cat{font-size:9px;color:var(--tx4);margin-top:2px}
.img-card .overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);opacity:0;transition:opacity .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.img-card:hover .overlay{opacity:1}
.img-card .overlay button{padding:6px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer}
.img-card .overlay .rep{background:var(--ac);color:#fff;border:none}
.img-card .overlay .del{background:transparent;color:var(--rd);border:1px solid rgba(239,68,68,.3)}
.img-add-card{border:2px dashed var(--bd);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:160px;cursor:pointer;transition:all .15s;color:var(--tx4)}
.img-add-card:hover{border-color:var(--ac);color:var(--ac)}
.img-add-card .plus{font-size:28px;margin-bottom:4px}
.img-add-card .lb{font-size:11px;font-weight:700}
/* ── r60) 제품 카드 그리드 ────────────────────────────────────────────
   승연 지시: 「갤러리처럼 수정할 수 있게 … 플레이스 홀더 넣고 그 안에 제품 넣고
   이름 넣고 특징 넣을 수 있도록」. 그래서 겉모습은 위 .img-card 를 따라간다.
   ★ 다만 **배관은 갤러리 것을 안 쓴다.** 갤러리(GALLERY_IMGS)는 발행 경로가 아예 없어
     고쳐도 그 브라우저에서만 바뀐다 — 그대로 베끼면 R1(공지)과 같은 「되는 것처럼 보이는
     기능」이 하나 더 생긴다. 이 카드는 r55 의 productPatch → /api/products 로 붙였다. */
.pg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pg-card{position:relative;background:var(--cd);border:1px solid var(--bd);border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s;display:flex;flex-direction:column}
.pg-card:hover{border-color:var(--ac);box-shadow:0 8px 24px -10px rgba(59,130,246,.25)}
.pg-card.is-added{border-color:rgba(34,197,94,.45)}
.pg-card.is-edited{border-color:rgba(251,191,36,.45)}
.pg-card.is-deleted{border-color:rgba(239,68,68,.45);opacity:.5}
/* 사진칸 = 업로드 버튼. 제품 누끼는 배경이 투명한 PNG 가 섞여 있어 cover 로 자르면
   가장자리가 날아간다 → contain + 어두운 판. */
.pg-ph{position:relative;width:100%;aspect-ratio:4/3;background:#0f0f16;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.pg-ph img{width:100%;height:100%;object-fit:contain;display:block;padding:6px}
.pg-ph .none{font-size:10px;color:var(--tx4);text-align:center;line-height:1.6}
.pg-ph .cam{position:absolute;left:0;right:0;bottom:0;padding:5px 0;text-align:center;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));opacity:0;transition:opacity .15s}
.pg-card:hover .pg-ph .cam{opacity:1}
.pg-ph .tag{position:absolute;top:8px;left:8px;font-size:9.5px;font-weight:800;color:#fff;border-radius:4px;padding:3px 7px;letter-spacing:.04em}
.pg-ph .tag.best{background:var(--rd)}
.pg-ph .tag.new{background:var(--ac)}
.pg-bd{padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.pg-lb{font-size:9px;color:var(--tx4)}
.pg-in{width:100%;padding:5px 8px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;font-size:11px;color:var(--tx);font-family:inherit}
.pg-in:focus{outline:none;border-color:var(--ac)}
.pg-in:disabled{opacity:.4}
/* NEW/BEST 3단 토글 — 라디오 성격이라 세 칸을 붙여 「지금 어느 상태인지」가 한눈에 보이게 한다 */
.pg-bg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.pg-bg button{padding:4px 0;font-size:9.5px;font-weight:700;background:transparent;border:none;border-right:1px solid var(--bd);color:var(--tx4);cursor:pointer;transition:all .12s}
.pg-bg button:last-child{border-right:none}
.pg-bg button:hover{background:rgba(255,255,255,.04);color:var(--tx3)}
.pg-bg button.on{color:#fff}
.pg-bg button.on[data-v="NEW"]{background:var(--ac)}
.pg-bg button.on[data-v="BEST"]{background:var(--rd)}
.pg-bg button.on[data-v=""]{background:var(--bd);color:var(--tx2)}
.pg-ft{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:2px}
.pg-stem{font-size:8.5px;color:var(--tx4);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pg-x{padding:2px 7px;border-radius:5px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--rd);font-size:9.5px;cursor:pointer}
.pg-more{width:100%;padding:4px 0;border:1px dashed var(--bd);border-radius:6px;background:transparent;color:var(--tx4);font-size:9.5px;cursor:pointer}
.pg-more:hover{border-color:var(--ac);color:var(--ac)}
.pg-adv{display:flex;flex-direction:column;gap:6px;padding-top:2px;border-top:1px dashed var(--bd)}
.pg-badge{font-size:8.5px;padding:1px 5px;border-radius:4px;font-weight:700}
/* 플레이스홀더 = 새 제품 자리. 갤러리의 .img-add-card 와 같은 모양이되 카드 비율을 맞춘다 */
.pg-add{border:2px dashed var(--bd);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:210px;cursor:pointer;transition:all .15s;color:var(--tx4);text-align:center;padding:12px}
.pg-add:hover{border-color:var(--ac);color:var(--ac);background:rgba(96,165,250,.04)}
.pg-add .plus{font-size:30px;line-height:1;margin-bottom:6px}
.pg-add .lb{font-size:11.5px;font-weight:800}
.pg-add .sub{font-size:9.5px;opacity:.75;margin-top:3px;line-height:1.5}
@media(max-width:768px){
  .img-grid{grid-template-columns:repeat(2,1fr)}
  .img-grid.sm{grid-template-columns:repeat(3,1fr)}
  .pg-grid{grid-template-columns:repeat(2,1fr);gap:8px}
}

// 소스에서 지우는 것만으로는 부족하다. 관리자를 한 번이라도 연 브라우저에는 옛 11행이
// localStorage('usung-cms-state-v2') 에 그대로 남아 있어서, 배포해도 화면은 안 바뀐다.

const R48_SEED = {
  inquiries:     [['q1','김철수'], ['q2','이영희'], ['q3','박민수']],
  notice:        [['n1','2026년 춘절 배송 안내'], ['n2','신제품 프리미엄 후드 출시'], ['n3','봄맞이 특별 프로모션']],

};
/* ============== r58 : r48 공지 시드 9건 청소 ==============
 * 소스에서 지우는 것만으로는 부족하다(r48 에서 배운 그대로). 관리자를 한 번이라도 연
 * 브라우저에는 그 9건이 localStorage 에 그대로 남아 있고, r58 은 그 배열을 **발행**한다.
 * ★ 여기서도 배열을 통째로 비우지 않는다 — id 와 제목이 「둘 다」 맞는 행만 지운다.
 *   그 사이 승연이 쓴 진짜 공지는 제목이 달라 살아남는다. */
const R58_NOTICE_SEED = [
  ['n1','2026 설 연휴 A/S 운영 안내'],
  ['n2','창립 기념 감사 프로모션'],
  ['n3','2026 제품 카탈로그 v6 배포 안내'],
  ['n4','태엽감속기 빠찌링(베어링) 정품 교체 캠페인'],
  ['n5','파주 본사 주차장 확장 공사 안내'],
  ['n6','시공후기 리뷰 이벤트 — 스타벅스 기프티콘'],
  ['n7','F.V.D 방화댐퍼 2세대 정식 출시'],
  ['n8','설 연휴 기간 긴급 A/S 접수 안내'],
  ['n9','유성에이스 공식 블로그 리뉴얼 완료']
];
function r48DropSeed(rows, pairs, key){
  if(!Array.isArray(rows)) return rows;
  return rows.filter(function(r){
    return !pairs.some(function(p){ return r && r.id === p[0] && r[key] === p[1]; });
  });
}
function r48Purge(s){
  s.inquiries = r48DropSeed(s.inquiries, R48_SEED.inquiries, 'nm');
  if(s.boards){
    s.boards.notice        = r48DropSeed(s.boards.notice,        R48_SEED.notice,        'title');
    s.boards.board         = r48DropSeed(s.boards.board,         R48_SEED.board,         'title');
    s.boards.certification = r48DropSeed(s.boards.certification, R48_SEED.certification, 'title');
    /* ★★ r58 — 여기 있던 「비었으면 더미 9건을 도로 채운다」 줄을 삭제했다.
     *   r48 당시엔 공지에 발행 경로가 없어서 그 줄이 무해했다(화면 표시용).
     *   r58 이 /api/notice 를 열면서 **그 배열이 곧 발행 페이로드**가 됐다 →
     *   같은 줄이 「고객의 첫 발행 클릭 = 더미 9건 라이브 게시」로 뜻이 바뀐다.
     *   ★ 코드는 그대로인데 **주변이 바뀌어 위험해진 경우**다. 무해했던 줄을 다시 볼 것.
     *   빈 화면은 pullNotice() 가 서버 값으로 채운다.
     *   ★★★ r59 — 옛 9건 청소는 여기 있으면 안 된다. 아래 r59Purge() 로 옮겼다(이유는 거기). */
  }
}
/* ============== r59 : r58 공지 퍼지의 게이트를 고친다 ==============
 * ★★★ r58 은 이 청소를 r48Purge() 안에 넣었다. 그런데 r48Purge() 의 게이트는
 *   `seedVer < 48` 이고, r55 이후 관리자를 연 브라우저는 이미 **49** 다.
 *   = 옛 더미 9건을 실제로 갖고 있는 바로 그 브라우저에서만 청소가 안 돈다.
 * ★ 새 프로필로 검증하면 notice 가 애초에 비어 있어 **실패할 수가 없는 검사**가 된다
 *   (KNOWLEDGE 52). 통제군(seedVer 49 + 더미 9건 + 진짜 글 1건)으로 재서 잡았다 —
 *   라이브에서 9/9 생존, 화면 「총 10건」.
 * ★ r58 이 /api/notice 를 열었으므로 그 배열은 **곧 발행 페이로드**다.
 *   승연이 공지 하나만 저장해도 pushNotice() 가 더미 9건을 같이 올린다.
 * → 게이트를 r48 과 분리하고 seedVer 를 59 로 올린다. */
function r59Purge(s){
  if(!s.boards) return;
  /* ★ 배열을 통째로 비우지 않는다 — id 와 제목이 「둘 다」 맞는 행만 지운다.
   *   그 사이 승연이 쓴 진짜 공지는 제목이 달라 살아남는다(통제군으로 확인). */
  s.boards.notice = r48DropSeed(s.boards.notice, R58_NOTICE_SEED, 'title');
}

// ============== AUTH (r44 — 서버 검증) ==============
// 예전: admin/admin 을 이 파일 안에서 비교했다. 서버는 보지도 않았고 소스에 박혀 있었다.
//       거기에 「서버 키」 칸이 따로 있어서 비밀이 둘이었다(하나는 가짜).
// 지금: 비밀번호를 /api/login 이 검사하고, 통과하면 12시간짜리 서명 토큰을 준다.
//       그 토큰이 발행 권한이다. 비밀은 하나뿐이다.
// ★ 진입과 발행을 분리한 이유 — api/login.js 주석 참조.
//   비밀번호를 아직 아무도 모르면 로그인은 전부 실패한다. 그때 화면까지 막으면
//   Vercel 을 만지기 전까지 관리자가 죽는다. 그래서 「둘러보기」로는 들어올 수 있고,
//   대신 발행 버튼이 잠기고 배너가 뜬다.
function setToken(t){ if(t) sessionStorage.setItem('cms-token', t); else sessionStorage.removeItem('cms-token'); }
function getToken(){ return sessionStorage.getItem('cms-token') || ''; }
// 토큰 만료를 화면단에서 미리 안다. 서명은 서버만 검증하지만 exp 는 payload 에 평문으로 있다.
// ★ 이걸 안 하면 만료된 토큰으로 발행을 눌러야만 만료를 알게 된다 — 배너도 안 뜬다.
function tokenAlive(t){
  if(!t) return false;
  try{
    const p = t.slice(0, t.indexOf('.')).replace(/-/g,'+').replace(/_/g,'/');
    return Number(JSON.parse(atob(p)).exp) > Date.now();
  }catch(e){ return false; }
}
// 발행에 쓸 헤더. 토큰이 있으면 토큰, 없으면 예전 원문 키(있는 경우)로 물러난다.
function authHeaders(){
  const t = getToken();
  if(t && tokenAlive(t)) return { 'x-admin-token': t };
  if(t) setToken('');   // 만료분은 그 자리에서 버린다
  const k = sessionStorage.getItem('board-srv-key');
  return k ? { 'x-admin-key': k } : null;
}
/* r58) 아이디 칸 — 승연 「아이디 admin 비번 yuadmin 으로 가자」
 * ★ 이 검사는 클라이언트에서 한다. 숨기려는 게 아니라 **정직하게 그렇다** —
 *   소스를 열면 'admin' 이 그대로 보인다. 그래도 이렇게 두는 이유:
 *   진짜 잠금장치는 비밀번호 하나뿐이고(서버의 BOARD_ADMIN_KEY), 아이디를 서버로 옮기면
 *   납품 당일에 api/login.js 의 인증 계약을 바꾸게 된다 — 보안 이득 0, 사고 확률만 오른다.
 *   즉 이건 **비밀이 아니라 입력 편의**다. 나중에 계정을 여러 개 둘 일이 생기면
 *   그때 서버로 옮기고 이 상수를 지운다. */
const ADMIN_ID = 'admin';

async function doLogin(){
  const idEl = document.getElementById('loginId');
  const pwEl = document.getElementById('loginPw');
  const btn  = document.getElementById('loginBtn');
  const msg  = document.getElementById('loginMsg');
  const id = (idEl.value || '').trim();
  const pw = pwEl.value;
  if(!id){ msg.textContent = '아이디를 입력하세요'; idEl.focus(); return; }
  // 대소문자는 따지지 않는다 — 모바일 자판이 첫 글자를 대문자로 올린다.
  if(id.toLowerCase() !== ADMIN_ID){ msg.textContent = '아이디가 올바르지 않습니다'; idEl.focus(); return; }
  if(!pw){ msg.textContent = '비밀번호를 입력하세요'; pwEl.focus(); return; }
  btn.disabled = true; msg.textContent = '확인 중…';
  try{
    const r = await fetch('/api/login', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ pw })
    });
    const j = await r.json().catch(()=>({}));
    if(j.ok && j.token){
      setToken(j.token);
      sessionStorage.setItem('cms-auth','1');
      pwEl.value = '';                    // 원문을 DOM 에 남기지 않는다
      showApp();
      return;
    }
    if(r.status === 503){
      msg.innerHTML = '관리자 비밀번호가 아직 정해지지 않았습니다.<br>'
        + 'Vercel → Settings → Environment Variables → <b>BOARD_ADMIN_KEY</b> 를 정한 뒤 재배포하세요.';
    } else if(r.status === 401){
      /* r58) 「비번이 틀렸다」로만 끝내면 안 된다 — 실제로 제일 흔한 원인은 오타가 아니라
       *   **환경변수를 바꾸고 재배포를 안 한 것**이다. Vercel 은 배포 시점에 env 를 굽는다.
       *   대시보드에서 값을 저장해도 그 뒤 배포가 한 번 일어나야 서버가 새 값을 본다. */
      msg.innerHTML = '비밀번호가 일치하지 않습니다.<br>'
        + '<span style="color:#8e8e93">Vercel 에서 <b>BOARD_ADMIN_KEY</b> 를 방금 바꿨다면, '
        + '<b>재배포(Redeploy)</b>를 한 번 해야 새 비밀번호가 적용됩니다.</span>';
    } else {
      msg.textContent = j.error || ('로그인 실패 (' + r.status + ')');
    }
  }catch(e){
    msg.textContent = '서버에 연결하지 못했습니다 : ' + e.message;
  }finally{ btn.disabled = false; }
}
// 비밀번호 없이 진입 — 화면 확인과 임시저장(localStorage)만 된다.
function enterReadonly(){
  setToken('');
  sessionStorage.setItem('cms-auth','1');
  showApp();
}
function doLogout(){
  sessionStorage.removeItem('cms-auth');
  setToken('');
  sessionStorage.removeItem('board-srv-key');
  location.reload();

// ============== FIRESTORE REST ==============
const FS_URL = `https://firestore.googleapis.com/v1/projects/${FB.project}/databases/${FB.db}/documents`;
async function fsGet(path){
  const r = await fetch(`${FS_URL}/${path}?key=${FB.key}`);
  if(!r.ok) return null;
  return fromFd(await r.json());
}
async function fsPatch(path, data){
  const r = await fetch(`${FS_URL}/${path}?key=${FB.key}`, {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({fields: toFv(data)})
  });
  return r.ok;
}
function toFv(obj){
  const f = {};
  for(const k in obj){
    const v = obj[k];
    if(typeof v === 'string') f[k] = {stringValue:v};
    else if(typeof v === 'number') f[k] = {integerValue:v};
    else if(typeof v === 'boolean') f[k] = {booleanValue:v};
    else if(Array.isArray(v)) f[k] = {arrayValue:{values:v.map(x=>toFv({_:x})._)}};
    else if(v && typeof v === 'object') f[k] = {mapValue:{fields:toFv(v)}};
  }
  return f;
}
function fromFd(d){
  if(!d || !d.fields) return null;
  const o = {};
  for(const k in d.fields){
    const v = d.fields[k];
    o[k] = v.stringValue ?? v.integerValue ?? v.booleanValue ?? null;
  }
  return o;
}

function saveLocal(){
  localStorage.setItem('usung-cms-state-v2', JSON.stringify({
    content:S.content, arrays:S.arrays, images:S.images,
    inquiries:S.inquiries, boards:S.boards, theme:S.theme,
    productPatch: S.productPatch,   // r55) 제품 패치 상태 보존
    seedVer: 59   // r59) 49→59. r58 공지 시드 9건 청소가 seedVer 49 브라우저에서 안 돌던 것을 고친다.
  }));
}
function loadLocal(){
  try{
    const s = JSON.parse(localStorage.getItem('usung-cms-state-v2')||'null');
    if(s){
      S.content = {...D, ...s.content};
      S.arrays  = {...JSON.parse(JSON.stringify(D2)), ...s.arrays};
      S.images  = s.images || {};
      S.inquiries = s.inquiries || S.inquiries;
      S.boards = s.boards || S.boards;
      // migration: archive → certification
      if(S.boards.archive && !S.boards.certification){ S.boards.certification = S.boards.archive; delete S.boards.archive; }
      // migration r48: 데모 시드 11행 퇴출 (한 번 지우면 seedVer 로 다시 안 돈다)
      if(!s.seedVer || s.seedVer < 48){ r48Purge(S); }
      // migration r55: 구형 D2.products 더미 15개 제거 (arrays.products 는 이제 사용 안 함)
      if(!s.seedVer || s.seedVer < 49){ delete S.arrays.products; }
      /* migration r59: r48 공지 시드 9건 청소.
       * ★ r48Purge() 에 얹으면 안 된다 — 그쪽 게이트가 `< 48` 이라
       *   더미를 실제로 가진 seedVer 49 브라우저에서 영영 안 돈다(r58 의 실수). */
      if(!s.seedVer || s.seedVer < 59){ r59Purge(S); }
      // r55) 제품 패치 복원
      // ★ 복원이 saveLocal() 보다 **먼저**여야 한다. 뒤집히면 마이그레이션이 도는 로드에서
      //   아직 비어 있는 기본 패치가 저장돼 편집분을 덮어쓴다. 48→49 에서는 s.productPatch 가
      //   애초에 없어 손해가 없지만, 다음에 seedVer 를 또 올리면 그때 조용히 터진다.
      //   ★ r59 가 바로 그 「또 올리는」 경우다 — 순서가 이대로여야 편집분이 산다.
      if(s.productPatch) S.productPatch = s.productPatch;
      if(s.seedVer < 59 || !s.seedVer) saveLocal();
      if(S.sortBy && S.sortBy.archive){ S.sortBy.certification = S.sortBy.archive; delete S.sortBy.archive; }
      if(S.filterCat && S.filterCat.archive){ S.filterCat.certification = S.filterCat.archive; delete S.filterCat.archive; }
      S.theme = s.theme || 'dark';
    }
    if(S.theme === 'light') document.body.classList.add('light');
  }catch(e){}
}

function sArrEd(arrKey, idx, field, val){

}
function arrAdd(arrKey){
  if(!S.arrays[arrKey]) S.arrays[arrKey] = [];

function arrDel(arrKey, idx){

}
function arrMove(arrKey, idx, dir){
  const arr = S.arrays[arrKey];
  const j = idx + dir;
  if(j < 0 || j >= arr.length) return;
  [arr[idx], arr[j]] = [arr[j], arr[idx]];
  saveLocal(); R();
}
function sImgUp(iid, inp){

// ============== r55: UP_DATA 기반 제품 관리 ==============
// usung-catalog-data.js 의 window.UP_DATA 를 {stem,cat,mid,grp,name,finish,tags,img} 객체로 변환.

const PRODUCTS_BASE = (() => {

    //   ''로 눌러 두지 않으면 아래 prodEdit 의 「기준선과 같아졌나」 비교가
    //   ''(입력칸이 주는 값) vs undefined 로 어긋나 「수정됨」 배지가 안 지워진다.
    feat: r[7] == null ? '' : r[7],
    badge: r[8] == null ? '' : r[8],

  }));
})();

/* 대분류 목록 — ★ 박아 두지 않고 데이터에서 뽑는다.
   KNOWLEDGE 41 「관리자 하드코딩 목록은 반드시 썩는다 — 갱신하지 말고 없애라」.
   박아 두면 UP_DATA 에 분류가 하나 늘 때마다 관리자만 옛 세상을 보게 된다 —
   r55 가 고치려던 병(관리자 15개 vs 화면 215종)이 작은 규모로 재발한다.
   ★ 기준선뿐 아니라 **관리자가 방금 추가한 제품의 분류까지** 포함한다.
     안 그러면 새 분류를 만든 순간 그 제품이 필터 어디에도 안 걸린다.
   함수인 이유: add 가 실시간으로 늘어나므로 렌더할 때마다 다시 계산해야 한다. */
/* 속성값 이스케이프.
   ★ 기존 escHtml() 은 &<> 만 바꾼다 — 따옴표를 안 막아서 value="..." 안에서는 못 쓴다.
   제품명에 큰따옴표가 하나만 들어가도 input 이 거기서 끊겨 폼이 깨진다(관리자가 제일 먼저 만난다).
   서버(api/products.js clean())가 <> 는 걷어내지만 따옴표는 통과시키므로
   value="a" onfocus="..." 같은 속성 주입도 여기서 막아야 완결된다. */
function escAttr(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// onclick="fn('...')" 안에 들어가는 stem 용. stem 은 서버·화면 양쪽에서
// /^[A-Za-z0-9_-]+$/ 로 검증되지만, 검증 전 상태로 렌더되는 순간이 있어 한 겹 더 둔다.
function escJs(s){ return String(s == null ? '' : s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

/* 썸네일에 무엇을 걸까.
   ① 방금 올린 사진(S.photoPreview)이 있으면 그걸 — 배포 빌드 1~2분을 기다리지 않고 바로 보인다
   ② 없으면 리포의 실제 파일. ★ 쿼리스트링을 붙이지 않는다 —
     붙이면 215장이 매번 캐시를 비껴가 관리자 탭이 열릴 때마다 47MB 를 새로 받는다. */
function photoSrc(p){
  const pv = S.photoPreview && S.photoPreview[p.stem];
  return pv || p.img;
}

function productCats(){
  const seen = [];
  const push = (c) => { c = String(c || '').trim(); if (c && seen.indexOf(c) < 0) seen.push(c); };
  PRODUCTS_BASE.forEach(p => push(p.cat));
  (S.productPatch && S.productPatch.add || []).forEach(a => push(a.cat));
  Object.keys(S.productPatch && S.productPatch.edit || {}).forEach(k => push(S.productPatch.edit[k].cat));
  return seen;
}

// 제품 검색/필터 상태 (products 탭 전용)
let prodFilter = '전체';
let prodSearch = '';

// 기준선(PRODUCTS_BASE)에 S.productPatch 를 얹어 현재 목록을 계산한다.
// 반환: [{stem,..., _status:'base'|'edited'|'added'|'deleted'}]
function effectiveProducts(){
  const p = S.productPatch;
  const delSet = new Set(p.del || []);
  const editMap = p.edit || {};
  const adds = p.add || [];

  const result = PRODUCTS_BASE.map(item => {
    if(delSet.has(item.stem)) return { ...item, _status:'deleted' };
    if(editMap[item.stem]) return { ...item, ...editMap[item.stem], img: item.img, stem: item.stem, _status:'edited' };
    return { ...item, _status:'base' };
  });

  // 신규 추가 제품
  for(const a of adds){
    result.push({ ...a, img:`products/final/${a.stem}.png`, _status:'added' });
  }
  return result;
}

/* ★★★ 「제품그룹」이 곧 화면 카드 제목이다 — **215행 중 122행에서만 맞는 말이다.**
     (아래 ★★★ 블록이 나머지 93행을 정정한다. 이 문단은 그 정정 전의 이해다.)
     usung-r8-prod-a.js:33 은 제품을 `cat|mid|grp` 로 묶고, 56행의
     `modelName = m.grp || m.mid || m.rep.name` 로 **그룹**을 카드·상세 제목에 쓴다.
     즉 관리자에서 「제품명」을 아무리 예쁘게 지어도 화면 제목은 그게 아니다
     (제품명은 검색어와 색상 이름표로 쓰인다 — 그것도 중요하지만 제목은 아니다).

   ★ 그래서 같은 그룹을 쓰면 카드가 안 생기고 **기존 카드에 마감으로 합류**한다.
     실측: grp='양옆태엽' 로 넣었더니 카드 17개 그대로 · 「색상·마감 4종」으로만 늘었고,
           grp='r55검증그룹' 으로 넣으니 카드가 18개가 됐다(281x363 신규 카드).
     둘 다 정상 동작이지만 **어느 쪽인지 모르고 쓰면 「추가했는데 안 보인다」가 된다.**
     KNOWLEDGE 32(화면 소유권)가 이 탭에서 재발하는 형태다. 그래서 입력칸 밑에 실시간으로 알린다. */
/* ★★ 예외가 하나 더 있다 — usung-r8-prod-a.js:32. 중분류가 「기타옵션」이거나
     (LED조명 > 디자인등) 이면 r8 은 **제품그룹을 아예 안 쓴다.** 대신
     baseOf = 제품명에서 마감 문자열을 뺀 것(usung-r8-data.js:188)으로 카드를 가른다.
     모양이 제각각인 잡동사니를 한 카드의 「마감」으로 뭉치면 안 되기 때문이다.

   ★★★ 그런데 그것보다 훨씬 큰 것을 빼먹고 있었다 — r8 은 UP_DATA 를 **그대로 묶지 않는다.**
     r8Build()(usung-r8-prod-a.js:7~24)는 묶기 **전에** 원본을 두 번 갈아엎는다.
     나는 그 18줄을 안 읽고 26행의 묶음 루프만 옮겼다. 그래서 이 탭의 안내가
     **215종 중 93종에서 정반대**를 말하고 있었다.
     내 재구현끼리 대조해서는 영영 안 나온다 — 양쪽이 똑같이 틀렸기 때문이다.
     프리뷰에서 화면이 만든 `MODELS` 를 직접 읽고서야 드러났다(내 55장 vs 화면 **62장**).
     ★ 그 고정점을 `/tmp/r55fixture.json` 으로 떠 놨다 — 키 62개 + 카드별 제품 수.
       회귀 테스트(`/tmp/_r55grp.mjs` §A)가 그것과 한 장씩 대조한다.
       **오라클은 화면이다. 내가 다시 쓴 규칙이 아니다.**

     ① **코브라후드** — 제품명이 같은 행은 **첫 하나만 남기고 버린다.**
        남은 행은 중분류를 비우고 **제품그룹 자리에 제품명을 넣는다.**
        즉 기준선 18행 중 **9행이 화면에 아예 안 나온다**(260729 회의: 이 계열은 중분류가 없다).
        「고쳤는데 아무 일도 안 일어난다」의 가장 확실한 원인인데 여태 아무 말도 안 했다.
     ② **파이프**(기타옵션 제외) — **중분류와 제품그룹을 맞바꾼다.**
        원본은 중분류=마감(스텐도금·스텐도장·스파이얼)·그룹=동작(양옆태엽·텐션·내부태엽)인데
        화면은 그 반대다. 그래서 이 75행에서는 **「중분류」 칸에 적은 값이 카드 제목**이고
        「제품그룹」 칸은 화면에서 중분류(띠 제목)로 쓰인다. 이름표가 정확히 거꾸로였다.
     ③ 그 다음에야 heterog 예외가 걸린다(파이프|기타옵션 14 · LED조명|디자인등 4). */
const isHetero = p => (p.mid === '기타옵션') || (p.cat === 'LED조명' && p.mid === '디자인등');
const baseOfP = p => {
  const n = String(p.name || ''), f = String(p.finish || '');
  return (f ? n.split(f).join('') : n).replace(/\s+/g,' ').trim();
};

/* r8Build 의 전처리를 한 줄씩 그대로 옮긴다. 순서까지 같아야 한다 —
   코브라후드 중복 판정이 **UP_DATA 순서에서 앞선 것**을 남기기 때문이다.
   effectiveProducts() 는 새로 추가한 행을 뒤에 붙이므로, 이름이 겹치면
   새 행이 버려지는 쪽이 된다. 그게 화면의 실제 동작이다. */
function r8Rewrite(list){
  const seenCob = {};
  return list.map(p => {
    if(p._status === 'deleted') return { ...p, _drop:'del' };
    if(p.cat === '코브라후드'){
      if(seenCob[p.name]) return { ...p, _drop:'dup' };
      seenCob[p.name] = 1;
      return { ...p, mid:'', grp: p.name };
    }
    if(p.cat === '파이프' && p.mid !== '기타옵션')
      return { ...p, mid: p.grp, grp: p.mid };
    return { ...p };
  });
}
const grpTok = p => isHetero(p) ? baseOfP(p) : (p.grp || '');
const grpKey = p => (p.cat||'')+'|'+(p.mid||'')+'|'+grpTok(p);

/* 화면이 실제로 만들 카드 지도. 안내·이름표는 전부 이것만 보고 판단한다. */
function r8View(list){
  const rows = r8Rewrite(list || effectiveProducts());
  const byStem = new Map(), byKey = new Map();
  rows.forEach(n => {
    byStem.set(n.stem, n);
    if(n._drop) return;
    const k = grpKey(n);
    if(!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(n);
  });
  /* ★★ 고정점과 대조하다 새로 드러난 것 — **제목이 겹치는 카드가 62장 중 13장**이다.
       파이프 「스텐도금」은 카드가 셋(양옆태엽·텐션·내부태엽), 「스텐도장」·「스파이얼」도 셋씩,
       갤럭시 「양옆태엽」·「내부태엽」은 둘씩. 제목만 대면 승연은 **어느 카드인지 못 고른다** —
       「기존 카드 스텐도금에 합류」라고 적어 놓고 정작 화면엔 스텐도금이 셋 있는 꼴이다.
       그래서 겹치는 제목에만 묶음 이름(= 화면의 띠 제목 = n.mid)을 덧댄다.
       전부에 붙이면 393px 에서 안내가 행을 잡아먹는다 — 겹칠 때만이다. */
  const seenT = new Map(), dupTitle = new Set();
  byKey.forEach(v => {
    const n = v[0], t = n.cat + '|' + (grpTok(n) || n.mid);
    if(seenT.has(t)) dupTitle.add(t); else seenT.set(t, 1);
  });
  return { byStem, byKey, dupTitle, cards: byKey.size,
           dropped: rows.filter(r => r._drop === 'dup').length };
}

/* ★ 승연이 보는 것은 **입력칸**이다. 그러니 「카드 제목이 어느 칸에서 오는가」를
     반드시 **원본 칸 이름**으로 답해야 한다. 정규화 뒤의 이름으로 답하면
     파이프 75행에서 정확히 반대 칸을 가리키게 된다. */
function titleBox(raw){          // 'name' | 'mid' | 'grp'
  if(!raw) return 'grp';
  if(raw.cat === '코브라후드') return 'name';            // r8 이 제품그룹에 제품명을 넣는다
  if(isHetero(raw)) return 'name';                       // baseOf(제품명 − 마감)
  if(raw.cat === '파이프') return raw.mid ? 'mid' : (raw.grp ? 'grp' : 'name');
  return raw.grp ? 'grp' : (raw.mid ? 'mid' : 'name');
}
const BOXNAME = { name:'제품명', mid:'중분류', grp:'제품그룹' };
/* ★ 칸 이름표도 행마다 달라야 한다. 「제품명은 카드 제목이 아니다」는 197종에서는 맞지만
     heterog 18종에서는 **정반대**다 — 거기선 제품명이 곧 제목이고 제품그룹은 무시된다.
     한 문장을 모든 행에 박아 두면 그 18행에서 이름표가 적극적으로 거짓말을 한다. */
function nameLabHTML(p){
  const t = titleBox(p);
  return t === 'name'
    ? `제품명 <span style="opacity:.7">(← <b>이게 화면 카드 제목</b>입니다)</span>`
    : `제품명 <span style="opacity:.7">(검색어·색상 이름표 — 카드 제목은 「${BOXNAME[t]}」입니다)</span>`;
}
/* ★ 중분류에도 이름표가 필요해졌다. 파이프에서는 이 칸이 카드 제목이 되기 때문이다.
     여태 이 칸엔 아무 설명이 없어서 승연이 제목을 바꾸려면 어디를 만져야 하는지
     알 길이 없었다 — 그리고 「제품그룹」 이름표는 반대편을 가리키고 있었다. */
function midLabHTML(p){
  if(titleBox(p) === 'mid')
    return `중분류 <span style="opacity:.7">(← <b>화면 카드 제목</b>)</span>`;
  if(p.cat === '파이프')
    return `중분류 <span style="opacity:.7">(화면에서는 제품그룹 자리로 갑니다)</span>`;
  if(p.cat === '코브라후드')
    return `중분류 <span style="opacity:.7">(코브라후드는 중분류를 <b>안 씁니다</b>)</span>`;
  return `중분류`;
}
function grpLabHTML(p){
  if(titleBox(p) === 'grp')
    return `제품그룹 <span style="opacity:.7">(← 화면 카드 제목)</span>`;
  if(p.cat === '파이프')
    return `제품그룹 <span style="opacity:.7">(화면에서는 <b>중분류</b>로 쓰입니다)</span>`;
  if(p.cat === '코브라후드')
    return `제품그룹 <span style="opacity:.7">(코브라후드에서는 <b>쓰이지 않습니다</b>)</span>`;
  return `제품그룹 <span style="opacity:.7">(「${escHtml(p.mid)}」에서는 <b>쓰이지 않습니다</b>)</span>`;
}
function grpHintHTML(me, view){
  if(!me || me._status === 'deleted') return '';
  const n = view && view.byStem ? view.byStem.get(me.stem) : null;
  if(!n) return '';
  /* ★★★ 「어느 카드에 묶인다」보다 먼저 말해야 할 것이 있다 — **아예 안 나오는 행.**
       코브라후드는 제품명이 같으면 앞의 하나만 살아남는다(r8Build 12~18행).
       기준선 18행 중 9행이 여기 걸린다. 이걸 안 알리면 승연은 그 9행을 고치고
       화면을 보고 「반영이 안 된다」고 하게 된다 — KNOWLEDGE 32 가 이 탭에서
       재발하는 가장 지독한 형태다. 화면 소유권이 아니라 아예 존재하지 않는다. */
  if(n._drop === 'dup')
    return me._status === 'base'
      ? `<span style="color:var(--tx4)">제품명이 같은 앞 행이 있어 <b>화면에는 안 나옵니다</b> <span style="opacity:.75">(코브라후드는 같은 제품명을 하나만 씁니다)</span></span>`
      : `<span style="color:var(--rd)">⚠ 같은 제품명이 이미 있어 <b>화면에 안 나옵니다</b> — 제품명을 다르게 적으세요</span>`;
  const mates = (view.byKey.get(grpKey(n)) || []).filter(p => p.stem !== n.stem);
  /* ★★ 빨간불의 조건을 「그룹이 비었다」로 잡으면 안 된다 — 실측에서 46개가 켜졌다.
       기준선에는 **그룹은 비었지만 중분류가 있는** 제품이 44종 있고, 그건 제목이
       중분류로 떨어지는 **정상 구조**다(modelName 의 둘째 갈래). 정상인 것에 경고를
       띄우면 46개 중 진짜 2개를 못 찾는다 — 경고가 많으면 경고가 아니다.
     ★ 진짜 함정은 **그룹도 중분류도 빈** 경우다. 키가 `대분류||` 가 되어
       그 대분류에 새로 넣은 제품이 전부 한 카드로 뭉치고, 두 번째부터는
       카드가 아니라 첫 제품의 「마감」으로 들어가 사실상 안 보인다.
       prodAddNew() 가 정확히 그 상태로 행을 만든다. 여기만 빨간불이다. */
  const label = grpTok(n) || n.mid;   // 카드 제목이 될 값 (modelName 의 첫째·둘째 갈래)
  /* ★ 「비었으니 여기를 적으세요」의 **여기**는 대분류마다 다르다. 파이프는 중분류가
       화면 제목이 되고, 코브라후드·기타옵션은 제품명이 제목이다. 한 문장으로 뭉뚱그려
       「제품그룹을 적으세요」라고 하면 그 93행에서는 적어도 아무 일이 안 일어난다. */
  const fill = (n.cat === '코브라후드' || isHetero(n)) ? 'name'
             : (n.cat === '파이프') ? 'mid' : 'grp';
  if(!label){
    /* ★★★ 여기서 한 번 더 좁혔다 — 위 기준(둘 다 빔)만으로도 기준선에서 **9개**가 켜졌다.
         전부 대분류 「코브라후드」다(KNOWLEDGE 36 — 이 계열은 원래 모델 칸이 비어 있다).
         셋이 아니라 아홉이 한 카드로 뭉쳐 있는데, 그게 **지금 라이브 화면의 모습**이고
         승연은 아무것도 안 했다. 손대지 않은 것에 경고를 띄우면 탭을 여는 순간
         빨간 글씨 9줄이 먼저 보인다 — 그건 「고칠 것이 아홉 개 있다」는 거짓말이다.
       ★ 그래서 판정 기준을 **데이터 모양이 아니라 「승연이 건드렸는가」**로 옮긴다.
         빨간불은 방금 추가·수정한 행에만 켠다. 기준선 그대로인 행은 사실만 회색으로 적는다. */
    /* ★ 카드 제목은 r8 이 `m.items[0]` 을 대표로 잡아 그 이름을 쓴다(usung-r8-prod-a.js:37).
         mates 는 원래 순서를 보존하고 새로 추가한 행은 항상 뒤에 붙으므로 mates[0] 이 대표다.
       ★ 대표조차 이름이 없을 수 있다 — 「+ 새 제품 추가」를 두 번 누른 직후가 그렇다.
         그때 「이름 없음」 카드라고 적으면 있지도 않은 이름을 가리키는 꼴이라 이름을 뺀다. */
    const rep = mates.length ? (grpTok(mates[0]) || mates[0].mid || mates[0].name || '') : '';
    const where = (rep ? `「${escHtml(rep)}」 카드에` : '먼저 추가한 제품과 한 카드로');
    if(me._status === 'base')
      return mates.length
        ? `<span style="color:var(--tx4)">${where} 함께 묶여 있습니다 — 지금 ${mates.length+1}종 <span style="opacity:.75">(제품그룹·중분류가 비어 있어서입니다)</span></span>`
        : `<span style="color:var(--tx4)">제품그룹·중분류가 비어 <b>제품명</b>이 카드 제목입니다</span>`;
    return mates.length
      ? `<span style="color:var(--rd)">⚠ 제품그룹·중분류가 모두 비어 ${where} <b>묶입니다</b> — 따로 나오게 하려면 「${BOXNAME[fill]}」을 적으세요</span>`
      : `<span style="color:#fbbf24">제품그룹·중분류가 비면 <b>제품명</b>이 카드 제목이 됩니다</span>`;
  }
  /* 왜 그 제목이 됐는지 한 줄로 붙인다 — 안 붙이면 「내가 적은 그룹이 왜 안 뜨지」가 된다.
     ★ 기타옵션·디자인등은 그룹을 적어도 무시되므로 그 사실을 명시해야 한다.
     ★ 393px 실측에서 이 줄이 **65px(5줄)** 를 먹었다. 폭이 125px 인 칸이라 설명을 길게 쓰면
       행 전체가 안내에 잡아먹힌다. 「마감을 뺀 것」은 마감이 실제로 있을 때만 붙인다 —
       마감이 비면 제품명이 곧 제목이라 그 설명은 아무것도 안 알려주면서 두 줄만 쓴다. */
  const via = isHetero(n) && grpTok(n)
    ? ` <span style="opacity:.75">(「${escHtml(n.mid)}」은 제품그룹 대신 <b>제품명</b>${n.finish ? '에서 마감을 뺀 것' : ''}으로 카드를 가릅니다)</span>`
    : n.cat === '코브라후드'
      ? ` <span style="opacity:.75">(코브라후드는 <b>제품명</b>이 곧 카드 제목입니다)</span>`
      : n.cat === '파이프'
        ? ` <span style="opacity:.75">(파이프는 화면에서 <b>중분류가 카드 제목</b>이 됩니다)</span>`
        : (grpTok(n) ? '' : ' <span style="opacity:.75">(제품그룹이 비어 중분류가 제목이 됩니다)</span>');
  /* 제목이 겹치는 카드가 있을 때만 묶음 이름을 덧댄다 — 겹치지 않으면 군더더기다. */
  const band = (view.dupTitle && view.dupTitle.has(n.cat + '|' + label) && n.mid)
    ? `<span style="opacity:.75">(${escHtml(n.mid)} 묶음)</span>` : '';
  return mates.length
    ? `<span style="color:var(--tx4)">기존 카드 「<b>${escHtml(label)}</b>」${band}에 <b>마감으로 합류</b> — 지금 ${mates.length+1}종${via}</span>`
    : `<span style="color:#22c55e"><b>새 카드</b> 「${escHtml(label)}」${band}가 생깁니다${via}</span>`;
}
/* 입력 중에는 R() 을 못 부른다(포커스가 날아간다) → 안내 div 만 갈아 끼운다.
   ★ 편집한 행 하나만 갈면 **틀린다.** 안내는 다른 행에 달려 있기 때문이다 —
     두 행이 다 그룹이 비면 둘 다 빨간불이어야 하는데, 편집한 행만 갈면
     나머지는 노란불(「제품명이 제목」)로 남는다. 잡으려던 함정이 반만 뜨는 셈이다.
   ★ 그래서 화면의 안내를 전부 다시 그린다. 215행이라 O(n²) 는 타이핑이 뻑뻑해지므로
     **r8View() 를 한 번만** 만들어 돌려 쓴다(전처리 1회 + Map 조회 O(1)).
     예전엔 키로 버킷팅해 같은 키의 행만 넘겼는데, 그러면 코브라후드 중복 판정이
     **버킷 안에서만** 돌아 「앞 행이 있어 안 나옴」을 못 본다 — 중복은 전체 순서에서
     결정되기 때문이다. 지도는 반드시 **전체로 한 번** 만들어야 한다. */
function grpHint(){
  const all = effectiveProducts();
  const raw = new Map();
  all.forEach(p => raw.set(p.stem, p));
  const view = r8View(all);
  document.querySelectorAll('[id^="gh-"]').forEach(el => {
    const me = raw.get(el.id.slice(3));
    el.innerHTML = me ? grpHintHTML(me, view) : '';
  });
  /* 헤더의 「화면 카드 N장」도 같이 간다 — 안 그러면 그룹을 바꿔 카드가 늘었는데
     위쪽 숫자만 옛것으로 남는다. 이 탭의 요구가 「유기적으로」이므로 숫자도 살아야 한다. */
  const cw = document.getElementById('r55-cards');
  if(cw) cw.textContent = view.cards;
  const dw = document.getElementById('r55-drop');
  if(dw) dw.textContent = view.dropped;
  /* ★ 이름표도 같이 간다. 중분류를 「기타옵션」으로 바꾸면 규칙이 통째로 뒤집히는데
       이름표만 옛 문장으로 남으면 **안내와 이름표가 서로 반대말을 한다.**
       그러면 승연은 둘 중 뭘 믿을지 고르게 되고, 그 순간 이 기능은 없느니만 못하다. */
  document.querySelectorAll('[id^="nl-"]').forEach(el => {
    const me = raw.get(el.id.slice(3));
    if(me) el.innerHTML = nameLabHTML(me);
  });
  document.querySelectorAll('[id^="ml-"]').forEach(el => {

  });
  document.querySelectorAll('[id^="gl-"]').forEach(el => {

  });
}

// 제품 필드를 인라인 수정 → S.productPatch.edit 에 적는다.
function prodEdit(stem, field, val){
  const base = PRODUCTS_BASE.find(p => p.stem === stem);
  if(!base) return;   // 신규 추가 제품은 addProdEdit() 로 처리
  const isAdd = (S.productPatch.add || []).some(a => a.stem === stem);
  if(isAdd){ addProdEdit(stem, field, val); return; }
  if(!S.productPatch.edit) S.productPatch.edit = {};
  if(!S.productPatch.edit[stem]) S.productPatch.edit[stem] = {};
  S.productPatch.edit[stem][field] = val;
  // 수정 후 기준선과 동일하면 edit 항목을 지운다
  const cur = S.productPatch.edit[stem];
  const allSame = Object.keys(cur).every(f => cur[f] === base[f]);
  if(allSame) delete S.productPatch.edit[stem];
  saveLocal();
}

/* ── r60) 특징 · NEW/BEST ──────────────────────────────────────────────
   ★★★ 이 두 칸은 **빈 값을 저장할 수가 없다.** 발행 경로가 빈 문자열을
     「지우기」가 아니라 「손대지 않음」으로 읽기 때문이다
     (api/products.js normalize · usung-r55-products.js:120 둘 다 `if(!s) continue`).
     그 규칙 자체는 옳다 — 없으면 방문자 화면의 제품명이 빈칸으로 덮인다.
     하지만 그대로 두면 **BEST 를 한 번 붙이면 영영 못 뗀다.**
   → 그래서 「일부러 비웠다」를 '-' 한 글자로 적어 보낸다. '-' 는 빈 값이 아니라서
     발행을 통과하고, 읽는 쪽 두 군데(여기와 usung-r8-prod-a.js:8)가 ''로 되돌린다.
   ★ 관리자 화면에는 '-' 를 절대 노출하지 않는다 — 아래 두 함수만 거쳐서 읽는다. */
const PROD_NONE = '-';
function prodShow(v){ v = String(v == null ? '' : v).trim(); return v === PROD_NONE ? '' : v; }
function featOf(p){ return prodShow(p.feat); }
function badgeOf(p){ const v = prodShow(p.badge).toUpperCase(); return (v === 'NEW' || v === 'BEST') ? v : ''; }

/* 입력칸이 비면 '' 가 아니라 '-' 를 저장한다(위 설명).
   ★ 신규 제품은 prodEdit() 로 보내면 안 된다 — 첫 줄 `if(!base) return` 에 걸려
     아무 일도 안 일어난다(기준선에 없는 stem 이니까). 그래서 기존 렌더러도
     editFn 을 골라 쓴다. 여기서도 같은 갈림길을 둔다. */
function prodSetField(stem, field, val){
  const v = String(val == null ? '' : val).trim();
  const out = v === '' ? PROD_NONE : v;
  const isAdd = (S.productPatch.add || []).some(a => a.stem === stem);
  if(isAdd) addProdEdit(stem, field, out); else prodEdit(stem, field, out);
}
// NEW/BEST 토글. 같은 값을 다시 누르면 해제된다 — 세 번째 버튼을 안 눌러도 뗄 수 있게.
function prodSetBadge(stem, val){
  const eff = effectiveProducts().find(p => p.stem === stem);
  const cur = eff ? badgeOf(eff) : '';
  prodSetField(stem, 'badge', cur === val ? '' : val);
  R();
}

// 「자세히」 펼침 상태 — 저장하지 않는다(화면 상태일 뿐, 발행과 무관)
const prodOpen = new Set();
function prodToggleAdv(stem){ prodOpen.has(stem) ? prodOpen.delete(stem) : prodOpen.add(stem); R(); }

// 신규 추가 제품 필드 수정
function addProdEdit(stem, field, val){
  const idx = (S.productPatch.add || []).findIndex(a => a.stem === stem);
  if(idx < 0) return;
  S.productPatch.add[idx][field] = val;

}

// 제품 삭제 (기준선 제품)
function prodDel(stem){
  if(!confirm(`「${stem}」 제품을 삭제하시겠습니까?\n방문자 화면에서 이 제품 카드가 사라집니다.`)) return;
  if(!S.productPatch.del) S.productPatch.del = [];
  if(!S.productPatch.del.includes(stem)) S.productPatch.del.push(stem);

  if(S.productPatch.edit && S.productPatch.edit[stem]) delete S.productPatch.edit[stem];

/* 새 제품 추가.
   ★ stem(=사진 파일명)은 **자동으로 짓는다. 관리자에게 묻지 않는다.**
     stem 은 R8_IMG + stem + '.png' 로 이미지 URL 이 만들어지는 내부 식별자일 뿐인데
     ① 방문자에게 안 보이는 값을 사람이 고민해야 하고
     ② 사진을 올린 뒤 stem 을 바꾸면 사진이 **고아가 된다**.
     승연 지시가 「알아서 기입이되고」이므로 물어보지 않는 쪽이 맞다.
     (예전 문구는 "stem 을 먼저 입력하세요" 였는데 **입력칸이 아예 없었다** — 지킬 수 없는 안내였다)
   ★ 분류 기본값도 박지 않는다 — 데이터에 있는 첫 분류를 쓴다(KNOWLEDGE 41). */
function prodAddNew(){
  // p20260819-143052 형태. 리포에서 사진을 찾을 때 언제 올린 것인지 바로 보인다.
  // 같은 초에 둘을 만들면 뒤에 -2, -3 이 붙는다.
  const d = new Date(), z = n => String(n).padStart(2,'0');
  const base = `p${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
  const taken = new Set([...PRODUCTS_BASE.map(p=>p.stem), ...(S.productPatch.add||[]).map(a=>a.stem)]);
  let stem = base, n = 2;
  while(taken.has(stem)) stem = `${base}-${n++}`;

  const cats = productCats();
  if(!S.productPatch.add) S.productPatch.add = [];
  S.productPatch.add.push({ stem, cat: cats[0] || '갤럭시', mid:'', grp:'', name:'', finish:'', tags:'', feat:'', badge:'' });
  saveLocal(); R();
  /* ★ 새 카드로 스크롤한다. 215종 그리드에서 새 카드는 맨 앞에 오지만,
       필터가 걸려 있으면 안 보일 수 있다 — 그때 「추가했는데 아무 일도 안 일어났다」가 된다.
       그래서 필터를 먼저 푼다. */
  prodFilter = '전체'; prodSearch = ''; R();
  setTimeout(() => {
    const el = document.getElementById('pcard-' + stem);
    if(el){ el.scrollIntoView({block:'center'}); const inp = el.querySelector('input'); if(inp) inp.focus(); }
  }, 0);
  toast('새 제품 자리가 만들어졌습니다 — 사진을 올리고 이름을 넣으세요');
}

/* ── 사진 업로드 ────────────────────────────────────────────────────
   서버(api/product-image.js)는 **PNG 만** 받는다 — 이미지 URL 이 항상 '.png' 로
   만들어지기 때문이다(usung-r8-data.js:7). 그래서 여기서 캔버스로 PNG 로 바꿔 보낸다.
   관리자가 휴대폰으로 찍은 JPEG 를 그대로 올려도 통과하게 하려는 것이다.
   ★ 동시에 긴 변 1600px 으로 줄인다. 원본 그대로 보내면 큰 사진이 413 으로 튕기는데,
     제품 카드는 240px 로 그려지므로 1600px 이면 확대해서 봐도 남는다.
     (현재 215장 실측: 평균 224KB · 최대 1.24MB) */
const IMG_MAX_EDGE = 1600;

function pickProductPhoto(stem){
  if(!/^[A-Za-z0-9_-]{1,40}$/.test(stem)){
    toast('제품 코드가 올바르지 않아 사진을 올릴 수 없습니다', true); return;
  }
  if(!authHeaders()){ toast('로그인해야 사진을 올릴 수 있습니다', true); return; }
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/png,image/jpeg,image/webp';
  inp.onchange = () => { const f = inp.files && inp.files[0]; if(f) uploadProductPhoto(stem, f); };
  inp.click();
}

function toPngDataUrl(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('파일을 읽지 못했습니다'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('이미지를 열지 못했습니다'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(!w || !h) return reject(new Error('이미지 크기를 알 수 없습니다'));
        const sc = Math.min(1, IMG_MAX_EDGE / Math.max(w, h));
        w = Math.round(w * sc); h = Math.round(h * sc);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        // ★ 투명 배경을 흰색으로 깔지 않는다 — 제품 사진에 배경 없는 PNG 가 섞여 있어서
        //   흰 배경을 깔면 카드에서 흰 네모가 된다.
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/png'));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function uploadProductPhoto(stem, file){
  const h = authHeaders();
  if(!h){ toast('로그인해야 사진을 올릴 수 있습니다', true); return; }
  toast('사진 변환 중…');
  let dataUrl;
  try { dataUrl = await toPngDataUrl(file); }
  catch(e){ toast('사진 처리 실패 : ' + e.message, true); return; }

  toast('사진 올리는 중…');
  try{
    const r = await fetch('/api/product-image', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', ...h },
      body: JSON.stringify({ stem, data: dataUrl })
    });
    const j = await r.json().catch(()=>({}));
    if(j.ok){
      /* ★ 낙관적 갱신 — 방금 만든 dataURL 을 그 자리에 건다.
         사진은 정적 파일이라 배포 빌드(1~2분)를 기다려야 실제로 바뀐다. 이걸 안 하면
         올린 사람이 옛 사진을 그대로 보고 「안 올라갔다」고 판단한다.
         ★ 저장하지 않는다(saveLocal 안 부름) — dataURL 은 수백 KB 라
           localStorage 5MB 한도를 몇 장 만에 깨뜨린다. 새로고침하면 사라지고,
           그때는 이미 배포본이 올라와 있다. */
      S.photoPreview = S.photoPreview || {};
      S.photoPreview[stem] = dataUrl;
      R();
      toast(`사진을 ${j.replaced?'교체':'등록'}했습니다 — 사이트 반영까지 1~2분 걸립니다`);
    }
    else if(r.status === 401){ onAuthExpired(); }
    else if(r.status === 503){ toast('서버 저장소가 아직 설정되지 않았습니다 (Vercel 환경변수 필요)', true); }
    else { toast('사진 올리기 실패 : ' + (j.error || r.status), true); }
  }catch(e){ toast('사진 올리기 실패 : ' + e.message, true); }
}

// GET /api/products → S.productPatch 에 반영 (페이지 로드 시 1회)
async function loadProductPatch(){
  try{
    const r = await fetch('/api/products', { cache:'no-store' });
    const j = await r.json().catch(()=>({}));
    if(!j.ok && !j.configured) return;   // 서버 미설정 — 로컬 패치만 쓴다
    // 서버 패치를 기준으로, 로컬에 편집 중인 내용이 없으면 서버 값으로 덮는다.
    // 로컬에 이미 edit/del/add 가 있으면 작업 중으로 판단해 병합하지 않는다.
    const localHasWork = (S.productPatch.add||[]).length > 0
      || Object.keys(S.productPatch.edit||{}).length > 0
      || (S.productPatch.del||[]).length > 0;
    if(!localHasWork){
      S.productPatch = { add: j.add||[], edit: j.edit||{}, del: j.del||[] };
      saveLocal();
      R();
    }
  }catch(e){ /* 네트워크 오류 — 로컬 패치로 계속 */ }
}

// 발행: 현재 S.productPatch 를 POST /api/products
async function publishProducts(){

  if(!h){ toast('로그인해야 제품을 발행할 수 있습니다', true); return; }
  const patch = S.productPatch;

  if(totalChanges === 0){ toast('변경된 제품이 없습니다', true); return; }

    });

}

       필터로 화면에 몇 행만 남아도 카드 계산은 전체 기준이어야 하므로 eff 로 만든다. */

  };

  // r60) 좌측 띠 색(stripColor)은 세로 목록 전용이었다 — 카드 그리드에는 띠가 없고
  //   테두리 색(.pg-card.is-added / .is-edited / .is-deleted)이 그 일을 한다. 그래서 지웠다.

     그래서 카드 앞면에는 딱 그 넷만 둔다 — 사진 · 이름 · 특징 · NEW/BEST.

     ★ 나머지(대분류·마감·중분류·제품그룹·태그)는 지우지 않고 「자세히」 안으로 접었다.
       지우면 안 된다: 제품그룹은 **화면 카드 제목을 정하는 칸**이고(usung-r8-prod-a.js:56)
       마감은 스타일 탭의 기준이다(usung-r8-prod-b.js:38). 없애면 r55 가 세운
       고정점(215행 → 카드 62장)이 조용히 무너진다. 안 보이게만 한 것이다.

     ★★ 신규·수정 카드를 맨 앞으로 올린다. 215장짜리 그리드에서 방금 추가한 제품이
       제자리(맨 끝)에 있으면 「추가했는데 아무 일도 안 일어났다」로 보인다.
       r55 가 세로 목록이었을 때 실제로 그렇게 읽혔다. */
  const rank = p => p._status === 'added' ? 0 : p._status === 'edited' ? 1 : p._status === 'deleted' ? 2 : 3;
  const ordered = shown.slice().sort((a, b) => rank(a) - rank(b));

  const cards = ordered.map(p => {
    const isDel = p._status === 'deleted';
    const isAdd = p._status === 'added';
    const editFn = isAdd ? `addProdEdit` : `prodEdit`;
    const sj = escJs(p.stem), sa = escAttr(p.stem);
    const bg = badgeOf(p);
    const open = prodOpen.has(p.stem);
    const dis = isDel ? ' disabled' : '';

    // ★ 현재 값이 목록에 없을 수도 있다(관리자가 새 분류를 직접 타이핑한 경우).
    //   그때 option 을 안 넣으면 select 가 첫 항목으로 **조용히 바뀐다** — 값이 유실된다.
    const catList = CATS.indexOf(p.cat) < 0 && p.cat ? CATS.concat([p.cat]) : CATS;
    const catSelect = catList.map(c =>
      `<option value="${escAttr(c)}"${p.cat === c ? ' selected' : ''}>${escHtml(c)}</option>`
    ).join('');

    const bgBtn = (v, lb) =>
      `<button data-v="${v}" class="${bg === v ? 'on' : ''}"${dis} title="${v ? v + ' 배지를 붙입니다 (다시 누르면 해제)' : '배지 없음'}"
        onclick="prodSetBadge('${sj}','${v}')">${lb}</button>`;

    const adv = !open ? '' : `<div class="pg-adv">
      <div>
        <div class="pg-lb">대분류</div>
        <select class="pg-in"${dis} onchange="${editFn}('${sj}','cat',this.value);grpHint()">${catSelect}</select>
      </div>
      <div>
        <div class="pg-lb">마감 <span style="opacity:.7">(스타일 탭 기준)</span></div>
        <input type="text" class="pg-in" list="r55-finishes" value="${escAttr(p.finish)}"${dis}
          oninput="${editFn}('${sj}','finish',this.value)">
      </div>
      <div>
        <div id="ml-${sa}" class="pg-lb">${midLabHTML(p)}</div>
        <input type="text" class="pg-in" list="r55-mids" value="${escAttr(p.mid)}"${dis}
          oninput="${editFn}('${sj}','mid',this.value);grpHint()">
      </div>
      <div>
        <div id="gl-${sa}" class="pg-lb">${grpLabHTML(p)}</div>
        <input type="text" class="pg-in" list="r55-grps" value="${escAttr(p.grp)}"${dis}
          oninput="${editFn}('${sj}','grp',this.value);grpHint()">
        <div id="gh-${sa}" style="font-size:9px;margin-top:3px;line-height:1.45">${grpHintHTML(p, view)}</div>
      </div>
      <div>
        <div class="pg-lb">태그 (| 구분) <span style="opacity:.7">— 검색·색상 이름표에 쓰입니다</span></div>
        <input type="text" class="pg-in" value="${escAttr(p.tags)}"${dis}
          oninput="${editFn}('${sj}','tags',this.value)">
      </div>
    </div>`;

    return `<div class="pg-card ${isAdd ? 'is-added' : p._status === 'edited' ? 'is-edited' : isDel ? 'is-deleted' : ''}" id="pcard-${sa}">
      <!-- 사진칸 = 업로드 버튼. 방금 올린 사진(S.photoPreview)이 있으면 그걸 먼저 보여준다 -->
      <div class="pg-ph" title="${isDel ? '삭제 예정인 제품입니다' : '클릭해서 사진 올리기 (JPG·PNG 모두 가능)'}"
        ${isDel ? 'style="cursor:default"' : `onclick="pickProductPhoto('${sj}')"`}>
        ${bg ? `<span class="tag ${bg === 'NEW' ? 'new' : 'best'}">${bg}</span>` : ''}
        <img src="${escAttr(photoSrc(p))}" alt="${escAttr(p.name)}" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <div class="none" style="display:none">사진 없음<br><span style="opacity:.7">클릭해서 올리기</span></div>
        ${isDel ? '' : `<div class="cam">📷 사진 ${photoSrc(p) ? '변경' : '올리기'}</div>`}
      </div>
      <div class="pg-bd">
        <div>
          <div id="nl-${sa}" class="pg-lb">${nameLabHTML(p)}</div>
          <input type="text" class="pg-in" value="${escAttr(p.name)}"${dis} placeholder="제품 이름"
            oninput="${editFn}('${sj}','name',this.value)">
        </div>
        <div>
          <div class="pg-lb">특징</div>
          <input type="text" class="pg-in" value="${escAttr(featOf(p))}"${dis} placeholder="예) 저소음 · 스테인리스"
            onchange="prodSetField('${sj}','feat',this.value)">
        </div>
        <div class="pg-bg">${bgBtn('NEW', 'NEW')}${bgBtn('BEST', 'BEST')}${bgBtn('', '없음')}</div>
        ${adv}
        <div class="pg-ft">
          <span class="pg-stem" title="사진 파일명입니다 — 자동으로 정해집니다">${escHtml(p.stem)}</span>
          ${badge(p._status)}
          <button class="pg-more" style="width:auto;padding:2px 8px" onclick="prodToggleAdv('${sj}')">${open ? '⌃ 접기' : '⌄ 자세히'}</button>
          ${isDel
            ? `<button class="pg-x" style="background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#22c55e" onclick="prodRestore('${sj}')">↩ 복원</button>`
            : isAdd
              ? `<button class="pg-x" onclick="prodAddDel('${sj}')">× 취소</button>`
              : `<button class="pg-x" onclick="prodDel('${sj}')">× 삭제</button>`
          }
        </div>
      </div>
    </div>`;
  }).join('');

  /* 플레이스홀더 카드 — 승연이 말한 「플레이스 홀더」가 이것이다.
     ★ 그리드 **맨 앞**에 둔다. 갤러리(rImgGrid)는 맨 뒤에 두는데, 거기는 50장이라
       끝까지 스크롤이 되지만 여기는 215장이다. 뒤에 두면 못 찾는다. */
  const addCard = `<div class="pg-add" onclick="prodAddNew()">
    <div class="plus">+</div>
    <div class="lb">새 제품 추가</div>
    <div class="sub">빈 자리가 하나 생깁니다<br>사진 · 이름 · 특징을 넣으세요</div>
  </div>`;

  return `
    <!-- 제품소개 관리 (r55) -->
    <div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
        <div>
          <div style="font-size:11px;color:var(--tx4);margin-bottom:2px">PRODUCTS CATALOG</div>
          <div style="font-size:18px;font-weight:800;color:var(--tx)">${PRODUCTS_BASE.length}종 제품 <span style="font-size:12px;font-weight:400;color:var(--tx3)">기준선</span></div>
          <!-- ★ 「몇 종」과 「카드 몇 장」은 다른 수다(215종 → 63장). 승연이 제일 알고 싶은 것은
                 화면이 어떻게 되느냐이므로 카드 수를 같이 적고, 편집할 때마다 갱신한다.
               ★ 「안 나오는 행」은 코브라후드 이름 중복이다 — 여기 안 적으면 영영 안 보인다. -->
          <div style="font-size:11px;color:var(--tx3);margin-top:3px">
            화면 카드 <b id="r55-cards" style="color:var(--tx2)">${view.cards}</b>장
            · 화면에 안 나오는 행 <b id="r55-drop" style="color:var(--tx2)">${view.dropped}</b>
          </div>
        </div>
        <div style="flex:1"></div>
        ${hasChanges ? `
          <div style="font-size:11px;color:var(--tx3);text-align:right">
            ${totalAdd>0?`<span style="color:#22c55e">+${totalAdd} 신규</span> `:''}
            ${totalEdit>0?`<span style="color:#fbbf24">${totalEdit} 수정</span> `:''}
            ${totalDel>0?`<span style="color:#ef4444">${totalDel} 삭제</span>`:''}
          </div>
          <button data-needs-auth onclick="publishProducts()" style="padding:8px 16px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;border:none;font-size:12px;font-weight:700;cursor:pointer">🚀 제품 발행</button>
        ` : `<span style="font-size:11px;color:var(--tx4)">변경 없음</span>`}
        <button onclick="prodAddNew()" style="padding:8px 14px;border-radius:8px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#22c55e;font-size:12px;font-weight:700;cursor:pointer">+ 새 제품 추가</button>
      </div>

      <!-- 검색 + 카테고리 필터 -->
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
        <input type="text" placeholder="🔍 제품명·카테고리·stem 검색…" value="${prodSearch}"
          oninput="prodSearch=this.value;R()"
          style="padding:7px 12px;background:var(--cd);border:1px solid var(--bd);border-radius:8px;font-size:12px;color:var(--tx);width:220px">
        <div style="display:flex;gap:5px;flex-wrap:wrap">${filterBtns}</div>
      </div>

      <!-- 발행 후 안내 -->
      ${!hasChanges && PRODUCTS_BASE.length > 0 ? '' : ''}
      ${hasChanges ? `<div style="padding:8px 12px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:8px;font-size:11px;color:rgba(251,191,36,.8);margin-bottom:12px">
        ⚠ 미발행 변경사항이 있습니다. 🚀 제품 발행 버튼을 눌러야 방문자 화면에 반영됩니다.
      </div>` : ''}

      <!-- 제품 목록 (r60) 세로 목록 → 카드 그리드.
           ★ 검색 결과가 없어도 「+ 새 제품」 자리는 남긴다. 그게 사라지면
             검색어를 지우기 전엔 제품을 추가할 방법이 없어진다. -->
      <div class="pg-grid">
        ${addCard}
        ${shown.length === 0
          ? `<div style="grid-column:1/-1;padding:32px;text-align:center;color:var(--tx4);font-size:12px;background:var(--cd);border-radius:12px">검색 결과가 없습니다</div>`
          : cards
        }
      </div>

      <!-- 안내 — ★ 두 가지가 서로 다른 속도로 반영된다는 걸 여기서 못 박는다.
           안 적으면 사진을 올리고 새로고침했다가 「안 올라갔다」고 판단하게 된다. -->
      <div style="margin-top:16px;padding:12px 16px;background:rgba(96,165,250,.05);border:1px solid rgba(96,165,250,.15);border-radius:10px;font-size:11px;color:var(--tx4);line-height:1.7">
        📷 <b style="color:var(--tx3)">사진</b> — 썸네일을 클릭하면 바로 올라갑니다(JPG·PNG 모두 가능, 자동으로 변환·축소됩니다).
        올린 즉시 이 화면에는 보이지만 <b style="color:var(--tx3)">홈페이지 반영까지는 1~2분</b> 걸립니다.
        <br>
        📝 <b style="color:var(--tx3)">제품 정보</b> — 이름·분류·태그를 고친 뒤 <b style="color:var(--tx3)">「제품 발행」</b>을 눌러야 홈페이지에 갑니다(약 30초).
        <br>
        🗂 사진 파일명은 자동으로 정해집니다 — 따로 입력하지 않으셔도 됩니다.
        <br>
        🎨 <b style="color:var(--tx3)">마감</b>은 홈페이지 <b style="color:var(--tx3)">스타일 탭(모던·클래식·프리미엄·레트로)</b>의 기준입니다.
        아래 목록에 있는 값을 쓰면 해당 탭에 함께 나오고, 새로 지어 쓰면 「전체」와 대분류에만 나옵니다.
        <br>
        🧩 <b style="color:var(--tx3)">화면의 카드 제목은 제품명이 아니라 제품그룹</b>입니다.
        (제품그룹이 비면 중분류, 그것도 비면 제품명 순서로 내려갑니다.)
        <b style="color:var(--tx3)">이미 있는 그룹</b>을 쓰면 그 카드에 색상·마감으로 <b style="color:var(--tx3)">합류</b>하고,
        <b style="color:var(--tx3)">새 이름</b>을 쓰면 <b style="color:var(--tx3)">카드가 새로 생깁니다</b>.
        각 칸 아래에 어느 쪽인지 바로 표시됩니다 — <b style="color:var(--rd)">빨간 글씨</b>가 뜨면
        그 제품은 다른 제품 카드 안에 숨어 화면에서 안 보입니다.
      </div>
      <!-- ★ 목록은 박지 않고 기준선에서 뽑는다(KNOWLEDGE 41). 실제 쓰이는 값이 곧 선택지다.
           ★ 중분류·제품그룹에도 같은 목록을 붙인 이유: 이 둘은 대분류와 함께 **카드를 묶는 키**다.
             한 글자만 달라도 카드가 따로 생긴다(「양옆태엽」 vs 「양옆 태엽」). 고르게 하면 오타가 준다. -->
      <datalist id="r55-finishes">${
        [...new Set(PRODUCTS_BASE.map(p=>p.finish).filter(Boolean))]
          .sort().map(f=>`<option value="${escAttr(f)}">`).join('')
      }</datalist>
      <datalist id="r55-mids">${
        [...new Set(eff.filter(p=>p._status!=='deleted').map(p=>p.mid).filter(Boolean))]
          .sort().map(f=>`<option value="${escAttr(f)}">`).join('')
      }</datalist>
      <datalist id="r55-grps">${
        [...new Set(eff.filter(p=>p._status!=='deleted').map(p=>p.grp).filter(Boolean))]
          .sort().map(f=>`<option value="${escAttr(f)}">`).join('')
      }</datalist>
    </div>`;
}

// 부품 이미지 목록
const PARTS_IMGS = Array.from({length:50},(_,i)=>({
  img: `parts/p${String(i+1).padStart(2,'0')}.png`,
  name: `부품 ${String(i+1).padStart(2,'0')}`,
  cat: '부품'
}));
// 갤러리 이미지 목록
const GALLERY_IMGS = Array.from({length:50},(_,i)=>({
  img: `gallery/g${String(i+1).padStart(2,'0')}.jpg`,
  name: `시공사례 ${String(i+1).padStart(2,'0')}`,
  cat: '시공갤러리'
}));

// 이미지 필터 상태
let imgFilter = { products:'전체', parts:'전체', gallery:'전체' };
let imgSearch = { products:'', parts:'', gallery:'' };

function setImgFilter(type, cat){
  imgFilter[type] = cat;
  R();
}
function setImgSearch(type, val){
  imgSearch[type] = val;
  R();
}

// 이미지 교체 (오버레이 버튼 → 파일선택)
function replaceImg(type, idx){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
      S.images[`${type}_${idx}`] = ev.target.result;
      saveLocal();
      R();
      toast('이미지가 교체되었습니다');
    };
    r.readAsDataURL(f);
  };
  inp.click();
}

// 새 이미지 추가
function addNewImg(type){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.multiple = true;
  inp.onchange = e => {
    const files = Array.from(e.target.files);
    let loaded = 0;
    if(!S.images._added) S.images._added = {};
    if(!S.images._added[type]) S.images._added[type] = [];
    files.forEach(f => {
      const r = new FileReader();
      r.onload = ev => {
        S.images._added[type].push({
          data: ev.target.result,
          name: f.name.replace(/\.[^.]+$/,''),
          cat: '새 이미지',
          addedAt: Date.now()
        });
        loaded++;
        if(loaded === files.length){
          saveLocal();
          R();
          toast(`${files.length}개 이미지가 추가되었습니다`);
        }
      };
      r.readAsDataURL(f);
    });
  };
  inp.click();
}

function delAddedImg(type, idx){
  if(!confirm('추가된 이미지를 삭제하시겠습니까?')) return;
  S.images._added[type].splice(idx,1);
  saveLocal(); R(); toast('삭제되었습니다');
}

// 이미지 이름 변경
function renameImg(type, idx){
  if(!S.images._names) S.images._names = {};
  const key = `${type}_${idx}`;
  const cur = S.images._names[key] || '';
  const nw = prompt('새 이름을 입력하세요:', cur);
  if(nw === null) return;
  if(nw.trim()) S.images._names[key] = nw.trim();
  else delete S.images._names[key];
  saveLocal(); R(); toast('이름이 변경되었습니다');
}
function renameAddedImg(type, idx){
  const item = S.images._added[type][idx];
  const nw = prompt('새 이름을 입력하세요:', item.name||'');
  if(nw === null) return;
  item.name = nw.trim()||item.name;
  saveLocal(); R(); toast('이름이 변경되었습니다');
}
function getImgName(type, idx, origName){
  return (S.images._names && S.images._names[`${type}_${idx}`]) || origName;
}

// 기존 이미지 삭제 (숨김 처리)
function hideImg(type, idx){
  if(!confirm('이 이미지를 삭제(숨김)하시겠습니까?')) return;
  if(!S.images._hidden) S.images._hidden = {};
  S.images._hidden[`${type}_${idx}`] = true;
  saveLocal(); R(); toast('이미지가 삭제되었습니다');
}
function restoreImg(type, idx){
  if(S.images._hidden) delete S.images._hidden[`${type}_${idx}`];
  saveLocal(); R(); toast('이미지가 복원되었습니다');
}
function isImgHidden(type, idx){
  return S.images._hidden && S.images._hidden[`${type}_${idx}`];
}

// 이미지 소스 가져오기 (교체된 이미지 우선, 없으면 원본)
function getImgSrc(type, idx, origPath){
  return S.images[`${type}_${idx}`] || origPath;
}

// 이미지 그리드 렌더 (공통) — compact: 제품용 작은 그리드
function rImgGrid(type, items, filterCats, opts){
  const compact = opts && opts.compact;
  const cat = imgFilter[type];
  const search = (imgSearch[type]||'').toLowerCase();
  let filtered = items;
  if(cat !== '전체') filtered = filtered.filter(p=>p.cat === cat);
  if(search) filtered = filtered.filter(p=>(p.name||'').toLowerCase().includes(search) || (p.cat||'').toLowerCase().includes(search));
  const added = (S.images._added && S.images._added[type]) || [];

  let h = `<div class="img-mgr">
    <div class="img-mgr-hd">

  filtered.filter(p=>!isImgHidden(type,items.indexOf(p))).forEach((p,origIdx) => {

    const isRenamed = !!(S.images._names && S.images._names[`${type}_${realIdx}`]);
    h += `<div class="img-card">

  // 추가된 이미지
  added.forEach((a,i)=>{

  h += `<div class="img-add-card" onclick="addNewImg('${type}')">
    <div class="plus">+</div>
    <div class="lb">이미지 추가</div>
  </div>`;

  h += `</div></div>`;
  return h;
}
